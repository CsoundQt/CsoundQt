name: Build And Publish
on:
  push:
    branches:
      - develop
      - csoundqt7
      - windows-build

  workflow_dispatch:

env:
  PACKAGENAME: CsoundQt
  APPNAME: CsoundQt-d-cs7
  CSOUND_VERSION: 7

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # Version pins for Qt, csound, csound-plugins and the manual all live in
      # build-appimage.sh, so key all caches on its contents.
      - name: Cache Qt install
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: build-appimage/qt
          key: qt-${{ runner.os }}-${{ hashFiles('installers/Linux/build-appimage.sh') }}

      - name: Cache source checkouts and downloads
        uses: actions/cache@v4
        with:
          path: |
            build-appimage/src
            build-appimage/downloads
          key: src-${{ runner.os }}-${{ hashFiles('installers/Linux/build-appimage.sh') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: build-appimage/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build AppImage
        run: |
          ./installers/Linux/build-appimage.sh --install-deps

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: CsoundQt-Linux
          path: build-appimage/*.AppImage
          if-no-files-found: error

  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-macos
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: update submodules
        run: |
          echo "Calling git submodule update"
          git submodule update --init --recursive
          git submodule status --recursive
          echo "Finished submodules"

      - name: Checkout Csound
        uses: actions/checkout@v4
        with:
          repository: csound/csound
          path: csound
          ref: develop

      - name: Get Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | awk '/Xcode/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Get Csound commit hash
        id: csound-hash
        run: echo "hash=$(git -C csound rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache Csound build
        id: cache-csound
        uses: actions/cache@v4
        with:
          path: csound/build-macos
          key: csound-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ steps.csound-hash.outputs.hash }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache-macos
          key: ccache-macos-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-
            ccache-macos-${{ runner.os }}-

      - name: Install ccache
        run: brew install ccache

      - name: macos csound build
        run: |
          cd csound
          brew install libogg flac lame libvorbis mpg123 opus libsndfile portaudio libsamplerate liblo portmidi
          brew install bison flex jack googletest
          # Keep the cached build dir on a hit, otherwise build from scratch.
          if [ "${{ steps.cache-csound.outputs.cache-hit }}" != 'true' ]; then
            rm -fr build-macos
            mkdir build-macos
          fi
          # We need a good build since we might be shipping that with the dmg
          cmake -B build-macos -DCUSTOM_CMAKE="./platform/osx/custom-osx.cmake" -DBUILD_TESTS=OFF
          # cmake .. -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DUSE_PORTMIDI=ON -DUSE_PORTAUDIO=ON -DUSE_PULSEAUDIO=OFF -DUSE_MP3=ON -DBUILD_OSC_OPCODES=ON -DBUILD_TESTS=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_UTILITIES=OFF -DBUILD_PERFTHREAD_CLASS=ON -DBUILD_CSBEATS=OFF
          cmake --build build-macos --parallel
          sudo cmake --install build-macos

      - name: macos build
        run: |
          set -o xtrace   # echo each command before it is executed

          pip install aqtinstall
          QTVERSION="6.8.2"
          aqt install-qt mac desktop $QTVERSION --outputdir ~/Qt
          export PATH="$HOME/Qt/$QTVERSION/macos/bin:$PATH"
          
          # brew update
          # brew list qt || brew install qt
          # brew link qt --force

          # csound_brew_root=$(brew --prefix csound)
          # echo "Csound brew root: $csound_brew_root"
          # download missing csPerthread.hpp
          # mkdir -p "$csound_brew_root/Frameworks/CsoundLib64.framework/Versions/7.0/Headers"
          # curl -o "$csound_brew_root/Frameworks/CsoundLib64.framework/Versions/7.0/Headers/csPerfThread.hpp" https://raw.githubusercontent.com/csound/csound/develop/interfaces/csPerfThread.hpp

          # ls -R "$csound_brew_root"

          ccache_args=(QMAKE_CC="$(command -v ccache) clang" QMAKE_CXX="$(command -v ccache) clang++")
          qmake CONFIG+=rtmidi CONFIG+=release "${ccache_args[@]}" qcs.pro

          # # --- Portable, safer parallelism for make (macOS-compatible) ---
          # NUM_PROCS=1
          # if command -v nproc >/dev/null 2>&1; then
          #   NUM_PROCS=$(nproc)
          # else
          #   # macOS: use sysctl to get logical CPU count
          #   NUM_PROCS=$(sysctl -n hw.logicalcpu 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 1)
          # fi
          # # Use at most half of CPUs (but at least 1), and cap to MAX_JOBS to avoid OOMs
          # NUM_JOBS=$(( NUM_PROCS > 2 ? NUM_PROCS / 2 : NUM_PROCS ))
          # MAX_JOBS=4
          # if [ "$NUM_JOBS" -gt "$MAX_JOBS" ]; then NUM_JOBS=$MAX_JOBS; fi
          # echo "Detected $NUM_PROCS CPUs, using $NUM_JOBS parallel jobs for make"
          # make -j"${NUM_JOBS}"
          # -------------------------------------------------------------

          # --- Bundle the offline Csound manual into the app bundle ------
          # CsoundQt auto-detects it at Contents/Resources/Manual on macOS
          # (see csoundqt.cpp). Same download as installers/Linux/build-appimage.sh.
          MANUAL_DIR="manual/csound7-manual-offline"
          if [ ! -d "$MANUAL_DIR" ]; then
            mkdir -p manual
            curl -L --fail --silent --show-error -o manual/csound7-manual-offline.zip \
              https://github.com/csound/manual/releases/download/latest/csound7-manual-offline.zip
            unzip -q manual/csound7-manual-offline.zip -d manual
          fi
          mkdir -p "bin/${{ env.APPNAME }}.app/Contents/Resources/Manual"
          cp -a "$MANUAL_DIR/." "bin/${{ env.APPNAME }}.app/Contents/Resources/Manual/"

          otool -L bin/${{ env.APPNAME }}.app/Contents/MacOS/${{ env.APPNAME }}
          hdiutil create -fs HFS+ -srcfolder bin/${{ env.APPNAME }}.app -volname CsoundQt CsoundQt.dmg

          find .
          echo "Creating artifacts folder"
          mkdir -p artifacts
          echo "Copying .dmg to artifacts"
          cp CsoundQt.dmg artifacts
          echo "Listing artifacts"
          ls artifacts
          echo "ready!"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CsoundQt-macOS
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Development Build pre-release
    needs: [appimage, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: CsoundQt-Linux
          path: artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: CsoundQt-macOS
          path: artifacts

      - name: List artifacts
        run: |
          ls -lR artifacts

      - name: Update latest tag
        if: github.ref_name == 'csoundqt7' || github.ref_name == 'develop'
        env: 
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method GET "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
          fi
        
      - name: Publish Development Build
        uses: softprops/action-gh-release@v3
        if: github.ref_name == 'csoundqt7' || github.ref_name == 'develop'
        with:
          token: ${{ github.token }}
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Development Build
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
