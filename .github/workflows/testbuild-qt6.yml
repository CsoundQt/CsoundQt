name: Test Build qt 6
on:
  push:
    branches:
      - csoundqt7
      - macos-debug
      
env:
  PACKAGENAME: CsoundQt
  APPNAME: CsoundQt-d-cs7
  CSOUND_VERSION: 7

jobs:
  buildjob:
    name: Test Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: update submodules
        run: |
          echo "Calling git submodule update"
          git submodule update --init --recursive
          git submodule status --recursive
          echo "Finished submodules"

      - name: Checkout Csound
        uses: actions/checkout@v4
        with:
          repository: csound/csound
          path: csound
          ref: develop

      - name: Get Csound commit hash
        id: csound-hash
        run: echo "hash=$(git -C csound rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache Csound build
        id: cache-csound
        uses: actions/cache@v4
        with:
          path: csound/build
          key: csound-${{ runner.os }}-${{ steps.csound-hash.outputs.hash }}

      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: macos csound build
        if: runner.os == 'macOS'
        run: |
          cd csound    
          brew install libogg flac lame libvorbis mpg123 opus libsndfile portaudio libsamplerate liblo portmidi
          brew install bison flex jack
          rm -fr build-macos
          mkdir build-macos && cd build-macos
          # We need a very minimal build
          cmake .. -DCMAKE_OSX_ARCHITECTURES=arm64 -DUSE_PORTMIDI=OFF -DUSE_PORTAUDIO=OFF -DUSE_PULSEAUDIO=OFF -DUSE_MP3=OFF -DBUILD_OSC_OPCODES=OFF -DBUILD_TESTS=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_UTILITIES=OFF -DBUILD_PERFTHREAD_CLASS=ON -DBUILD_CSBEATS=OFF
          cmake --build . --parallel
          sudo make install
                  
      - name: macos build
        if: runner.os == 'macOS'
        run: |
          set -o xtrace   # echo each command before it is executed

          brew update
          # homebrew defaults to qt6
          brew list qt || brew install qt
          brew link qt --force

          csound_brew_root=$(brew --prefix csound)
          echo "Csound brew root: $csound_brew_root"
          # download missing csPerthread.hpp
          mkdir -p "$csound_brew_root/Frameworks/CsoundLib64.framework/Versions/7.0/Headers"
          curl -o "$csound_brew_root/Frameworks/CsoundLib64.framework/Versions/7.0/Headers/csPerfThread.hpp" https://raw.githubusercontent.com/csound/csound/develop/interfaces/csPerfThread.hpp

          ls -R "$csound_brew_root"

          # qmake CONFIG+=rtmidi CONFIG+=release CSOUND_LIBRARY_DIR+="$csound_lib" qcs.pro
          qmake CONFIG+=rtmidi CONFIG+=release qcs.pro

          # --- Portable, safer parallelism for make (macOS-compatible) ---
          NUM_PROCS=1
          if command -v nproc >/dev/null 2>&1; then
            NUM_PROCS=$(nproc)
          else
            # macOS: use sysctl to get logical CPU count
            NUM_PROCS=$(sysctl -n hw.logicalcpu 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 1)
          fi
          # Use at most half of CPUs (but at least 1), and cap to MAX_JOBS to avoid OOMs
          NUM_JOBS=$(( NUM_PROCS > 2 ? NUM_PROCS / 2 : NUM_PROCS ))
          MAX_JOBS=4
          if [ "$NUM_JOBS" -gt "$MAX_JOBS" ]; then NUM_JOBS=$MAX_JOBS; fi
          echo "Detected $NUM_PROCS CPUs, using $NUM_JOBS parallel jobs for make"
          make -j"${NUM_JOBS}"
          # -------------------------------------------------------------

          otool -L bin/${{ env.APPNAME }}.app/Contents/MacOS/${{ env.APPNAME }}
          hdiutil create -fs HFS+ -srcfolder bin/${{ env.APPNAME }}.app -volname CsoundQt CsoundQt.dmg

          find .
          echo "Creating artifacts folder"
          mkdir -p artifacts
          echo "Copying .dmg to artifacts"
          cp CsoundQt.dmg artifacts
          echo "Listing artifacts"
          ls artifacts
          echo "ready!"

      - name: linux setup csound7
        if: runner.os == 'linux' # && steps.cache-csound.outputs.cache-hit != 'true'
        run: |
          # git clone -b develop https://github.com/csound/csound --depth 1
          cd csound
          sudo apt-get update && sudo apt-get install cmake libsndfile1-dev libasound2-dev libjack-dev portaudio19-dev libportmidi-dev default-jdk libpng-dev libgmm++-dev bison flex libportsmf-dev libeigen3-dev libcunit1-dev
          rm -fr build-linux
          mkdir build-linux && cd build-linux
          cmake .. -DUSE_PORTMIDI=OFF -DUSE_PORTAUDIO=OFF -DUSE_PULSEAUDIO=OFF -DUSE_MP3=OFF -DBUILD_OSC_OPCODES=OFF -DBUILD_TESTS=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_UTILITIES=OFF -DBUILD_PERFTHREAD_CLASS=ON -DBUILD_CSBEATS=OFF
          cmake --build . --parallel
          sudo make install
          # sudo cmake --install .
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          sudo ldconfig
          csound --version
          # strace -f -t -e trace=file csound -+rtaudio=dummy --devices=out | grep "\.so" || echo ok

      - name: Install Qt in linux
        if: runner.os == 'linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtpositioning'  # add extras you need
          cache: true  # caches the Qt install between runs

      - name: linux csoundqt7 build
        if: runner.os == 'linux'
        run: |
          # sudo apt install qt6-base-dev qmake6 qt6-declarative-dev qt6-webengine-dev
          qmake --version
          git submodule update --init --recursive
          qmake CONFIG+=rtmidi CONFIG+=release qcs.pro
          make -j$(nproc)
          mkdir -p artifacts
          cp bin/* artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: CsoundQt-${{ matrix.os }}-${{ strategy.job-index }}
          path: artifacts/*

  buildjob-arm64-linux:
    name: Test Build CsoundQt on Linux arm64
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: update submodules
        run: |
          git submodule update --init --recursive
          git submodule status --recursive
          echo "Finished submodules"

      - name: Checkout Csound
        uses: actions/checkout@v4
        with:
          repository: csound/csound
          path: csound
          ref: develop

      - name: linux arm64 setup csound7
        run: |
          cd csound
          sudo apt-get update && sudo apt-get install cmake libsndfile1-dev libasound2-dev libjack-dev portaudio19-dev libportmidi-dev default-jdk libpng-dev libgmm++-dev bison flex libportsmf-dev libeigen3-dev libcunit1-dev
          rm -fr build-linux
          mkdir build-linux && cd build-linux
          cmake .. -DUSE_PORTMIDI=OFF -DUSE_PORTAUDIO=OFF -DUSE_PULSEAUDIO=OFF -DUSE_MP3=OFF -DBUILD_OSC_OPCODES=OFF -DBUILD_TESTS=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_UTILITIES=OFF -DBUILD_PERFTHREAD_CLASS=ON -DBUILD_CSBEATS=OFF
          cmake --build . --parallel
          sudo make install
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          sudo ldconfig
          csound --version

      - name: Install Qt 6.10 (linux arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: 'linux_arm64'
          target: 'desktop'
          arch: 'linux_gcc_arm64'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: linux arm64 csoundqt7 build
        run: |
          qmake --version
          git submodule update --init --recursive
          qmake CONFIG+=rtmidi CONFIG+=release qcs.pro
          make -j$(nproc)
