name: Test Build qt 6
on:
  push:
    branches:
      - csoundqt7
      - macos-debug
      - windows-build
      
env:
  PACKAGENAME: CsoundQt
  APPNAME: CsoundQt-d-cs7
  CSOUND_VERSION: 7

jobs:
  buildjob:
    name: Test Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: update submodules
        run: |
          echo "Calling git submodule update"
          git submodule update --init --recursive
          git submodule status --recursive
          echo "Finished submodules"

      - name: Checkout Csound
        uses: actions/checkout@v4
        with:
          repository: csound/csound
          path: csound
          ref: develop

      - name: Get Csound commit hash
        id: csound-hash
        run: echo "hash=$(git -C csound rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache Csound build
        id: cache-csound
        uses: actions/cache@v4
        with:
          path: csound/build
          key: csound-${{ runner.os }}-${{ steps.csound-hash.outputs.hash }}

      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: macos csound build
        if: runner.os == 'macOS'
        run: |
          cd csound    
          brew install libogg flac lame libvorbis mpg123 opus libsndfile portaudio libsamplerate liblo portmidi
          brew install bison flex jack
          rm -fr build-macos
          mkdir build-macos && cd build-macos
          # We need a very minimal build
          cmake .. -DCMAKE_OSX_ARCHITECTURES=arm64 -DUSE_PORTMIDI=OFF -DUSE_PORTAUDIO=OFF -DUSE_PULSEAUDIO=OFF -DUSE_MP3=OFF -DBUILD_OSC_OPCODES=OFF -DBUILD_TESTS=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_UTILITIES=OFF -DBUILD_PERFTHREAD_CLASS=ON -DBUILD_CSBEATS=OFF
          cmake --build . --parallel
          sudo make install
                  
      - name: macos build
        if: runner.os == 'macOS'
        run: |
          set -o xtrace   # echo each command before it is executed

          brew update
          # homebrew defaults to qt6
          brew list qt || brew install qt
          brew link qt --force

          csound_brew_root=$(brew --prefix csound)
          echo "Csound brew root: $csound_brew_root"
          # download missing csPerthread.hpp
          mkdir -p "$csound_brew_root/Frameworks/CsoundLib64.framework/Versions/7.0/Headers"
          curl -o "$csound_brew_root/Frameworks/CsoundLib64.framework/Versions/7.0/Headers/csPerfThread.hpp" https://raw.githubusercontent.com/csound/csound/develop/interfaces/csPerfThread.hpp

          ls -R "$csound_brew_root"

          # qmake CONFIG+=rtmidi CONFIG+=release CSOUND_LIBRARY_DIR+="$csound_lib" qcs.pro
          qmake CONFIG+=rtmidi CONFIG+=release qcs.pro

          # --- Portable, safer parallelism for make (macOS-compatible) ---
          NUM_PROCS=1
          if command -v nproc >/dev/null 2>&1; then
            NUM_PROCS=$(nproc)
          else
            # macOS: use sysctl to get logical CPU count
            NUM_PROCS=$(sysctl -n hw.logicalcpu 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 1)
          fi
          # Use at most half of CPUs (but at least 1), and cap to MAX_JOBS to avoid OOMs
          NUM_JOBS=$(( NUM_PROCS > 2 ? NUM_PROCS / 2 : NUM_PROCS ))
          MAX_JOBS=4
          if [ "$NUM_JOBS" -gt "$MAX_JOBS" ]; then NUM_JOBS=$MAX_JOBS; fi
          echo "Detected $NUM_PROCS CPUs, using $NUM_JOBS parallel jobs for make"
          make -j"${NUM_JOBS}"
          # -------------------------------------------------------------

          otool -L bin/${{ env.APPNAME }}.app/Contents/MacOS/${{ env.APPNAME }}
          hdiutil create -fs HFS+ -srcfolder bin/${{ env.APPNAME }}.app -volname CsoundQt CsoundQt.dmg

          find .
          echo "Creating artifacts folder"
          mkdir -p artifacts
          echo "Copying .dmg to artifacts"
          cp CsoundQt.dmg artifacts
          echo "Listing artifacts"
          ls artifacts
          echo "ready!"

      - name: linux setup csound7
        if: runner.os == 'linux' # && steps.cache-csound.outputs.cache-hit != 'true'
        run: |
          # git clone -b develop https://github.com/csound/csound --depth 1
          cd csound
          sudo apt-get update && sudo apt-get install cmake libsndfile1-dev libasound2-dev libjack-dev portaudio19-dev libportmidi-dev default-jdk libpng-dev libgmm++-dev bison flex libportsmf-dev libeigen3-dev libcunit1-dev
          rm -fr build-linux
          mkdir build-linux && cd build-linux
          cmake .. -DUSE_PORTMIDI=OFF -DUSE_PORTAUDIO=OFF -DUSE_PULSEAUDIO=OFF -DUSE_MP3=OFF -DBUILD_OSC_OPCODES=OFF -DBUILD_TESTS=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_UTILITIES=OFF -DBUILD_PERFTHREAD_CLASS=ON -DBUILD_CSBEATS=OFF
          cmake --build . --parallel
          sudo make install
          # sudo cmake --install .
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          sudo ldconfig
          csound --version
          # strace -f -t -e trace=file csound -+rtaudio=dummy --devices=out | grep "\.so" || echo ok

      - name: Install Qt in linux
        if: runner.os == 'linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true  # caches the Qt install between runs

      - name: linux csoundqt7 build
        if: runner.os == 'linux'
        run: |
          qmake --version
          git submodule update --init --recursive
          qmake CONFIG+=rtmidi CONFIG+=release qcs.pro
          make -j$(nproc)
          mkdir -p artifacts
          cp bin/* artifacts

      # ------------------------------------------------------------------
      # Windows build. Instead of compiling Csound from source (there is no
      # apt/brew on Windows), we consume the official Csound 7 development
      # build produced by csound/csound's own GitHub Actions workflow. We then
      # compile csoundqt against csound and bundle the whole thing 
      # into a csoundqt installer via inno setup
      # ------------------------------------------------------------------

      - name: Set up MSVC command line environment (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve latest Csound 7 Windows installer from csound develop Actions
        id: csound-installer
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          mkdir -p csound-dl
          curl -fsSL "https://api.github.com/repos/csound/csound/actions/workflows/csound_builds.yml/runs?branch=develop&status=success&per_page=5" -o csound-dl/runs.json
          RUN_IDS=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(' '.join(str(r['id']) for r in d['workflow_runs']))" csound-dl/runs.json)
          ART_NAME=""
          RUN_ID=""
          for rid in ${RUN_IDS}; do
            curl -fsSL "https://api.github.com/repos/csound/csound/actions/runs/${rid}/artifacts?per_page=100" -o csound-dl/artifacts.json
            ART_NAME=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print([a['name'] for a in d.get('artifacts', []) if a['name'].startswith('Csound_x64-') and a['name'].endswith('-windows-installer')][0])" csound-dl/artifacts.json || true)
            if [ -n "${ART_NAME}" ]; then
              RUN_ID=${rid}
              break
            fi
          done
          test -n "${ART_NAME}" || { echo "No Csound_x64 windows-installer artifact found in recent csound develop runs"; exit 1; }
          echo "Found artifact: ${ART_NAME} on run ${RUN_ID}"
          echo "run-id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ART_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download and install latest Csound 7 development build (windows)
        id: csound-install-win
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          mkdir -p csound-dl
          # csound artifacts are not downloadable cross-repo with a plain token;
          # nightly.link mirrors them anonymously.
          curl -fsSL "https://nightly.link/csound/csound/actions/runs/${{ steps.csound-installer.outputs.run-id }}/${{ steps.csound-installer.outputs.artifact }}.zip" \
            -o csound-dl/csound-installer.zip
          powershell -Command "Expand-Archive -Path 'csound-dl/csound-installer.zip' -DestinationPath 'csound-dl' -Force"
          INSTALLER=$(find csound-dl -maxdepth 2 -iname 'Csound7-windows_x86_64-*.exe' | head -1)
          test -n "${INSTALLER}" || { echo "Csound installer exe not found in artifact"; exit 1; }
          echo "Csound installer: ${INSTALLER}"
          cp "${INSTALLER}" csound-dl/Csound7-windows_x86_64.exe
          # Silent install into a local folder (same layout as "Program Files\Csound7"):
          #   bin\csound64.dll, lib\csound64.lib, include\csound, plugins64
          CSOUND_DIR=$(cygpath -w "$GITHUB_WORKSPACE/csound7")
          MSYS_NO_PATHCONV=1 "${INSTALLER}" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=${CSOUND_DIR}"
          ls "$GITHUB_WORKSPACE/csound7"
          "$GITHUB_WORKSPACE/csound7/bin/csound.exe" --version
          echo "csound7-dir=$GITHUB_WORKSPACE/csound7" >> "$GITHUB_OUTPUT"

      - name: Install Qt in windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup (windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y innosetup --no-progress

      - name: windows csoundqt7 build
        if: runner.os == 'Windows'
        run: |
          qmake --version
          git submodule update --init --recursive
          # qcs.pro runs windeployqt6 at the end of the build; make that tool
          # resolve to the real windeployqt shipped with this Qt install.
          QT_BIN=$(dirname "$(command -v windeployqt)")
          if [ ! -f "${QT_BIN}/windeployqt6.exe" ]; then
            cp "${QT_BIN}/windeployqt.exe" "${QT_BIN}/windeployqt6.exe"
          fi
          CSOUND_DIR="$GITHUB_WORKSPACE/csound7"
          CSINC=$(cygpath -m "${CSOUND_DIR}/include/csound")
          CSLIB=$(cygpath -m "${CSOUND_DIR}/lib")
          # Keep csound64.dll next to the exe so the linker/deployment tools
          # never complain about a missing import.
          mkdir -p bin
          cp -f "${CSOUND_DIR}/bin/csound64.dll" bin/ 2>/dev/null || true
          qmake CONFIG+=rtmidi CONFIG+=release qcs.pro \
            "CSOUND_API_INCLUDE_DIR=${CSINC}" \
            "CSOUND_INTERFACES_INCLUDE_DIR=${CSINC}" \
            "CSOUND_LIBRARY_DIR=${CSLIB}"
          # nmake may report failure only because of qmake's post-build
          # deployment step; the real criterion is the produced executable.
          set +e
          # Git Bash puts GNU coreutils in PATH, where /usr/bin/link.exe
          # shadows MSVC's link.exe. Run nmake with a PATH that excludes the
          # MSYS/Git unix tool dirs so the MSVC toolchain is used exclusively.
          NMAKE_PATH=""
          while IFS= read -r p; do
            case "${p}" in
              */usr/bin|/usr/bin|*/bin|/bin|*/mingw*/bin) ;;
              *) NMAKE_PATH="${NMAKE_PATH}:${p}" ;;
            esac
          done < <(printf '%s' "${PATH}" | tr ':' '\n')
          NMAKE_PATH="${NMAKE_PATH#:}"
          env PATH="${NMAKE_PATH}" nmake
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "nmake exited with ${rc}; checking whether the build output was produced"
          fi
          ls -la bin
          test -f "bin/${{ env.APPNAME }}.exe"

      - name: windows build CsoundQt installer (bundles Qt and Csound)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          APP_EXE="bin/${{ env.APPNAME }}.exe"
          test -f "${APP_EXE}"
          # Make sure the Qt runtime is fully deployed next to the exe.
          if [ ! -f "bin/Qt6Core.dll" ]; then
            windeployqt --qmldir "$PWD/src/QML" "${APP_EXE}"
          fi
          CSOUND_DIR="$GITHUB_WORKSPACE/csound7"
          STAGE="$GITHUB_WORKSPACE/csoundqt-stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/plugins64"
          cp -r bin/. "${STAGE}/"
          # Bundle the Csound runtime CsoundQt was built against, so the
          # resulting installation is self-contained and distributable.
          cp -f "${CSOUND_DIR}/bin/csound64.dll" "${STAGE}/"
          if [ -d "${CSOUND_DIR}/plugins64" ]; then
            cp -rf "${CSOUND_DIR}/plugins64/." "${STAGE}/plugins64/"
          fi
          cp -f images/csoundqt.ico "${STAGE}/"
          mkdir -p artifacts
          export CSOUNDQT_VERSION="$(tr -d '\r\n ' < VERSION.txt)"
          export CSOUNDQT_APPNAME="${{ env.APPNAME }}.exe"
          export CSOUNDQT_STAGING_DIR="$(cygpath -w "${STAGE}")"
          export CSOUNDQT_BUILDNUM="${GITHUB_RUN_NUMBER}"
          # iscc only ships on the machine via choco; /o. puts the installer in cwd
          MSYS_NO_PATHCONV=1 iscc /o. installers/Windows/csoundqt7-x64.iss
          cp CsoundQt-*-windows_x86_64-*.exe artifacts/
          # pass the Csound installer (official development build) along too
          cp csound-dl/Csound7-windows_x86_64.exe artifacts/
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: CsoundQt-${{ matrix.os }}-${{ strategy.job-index }}
          path: artifacts/*

  buildjob-htmlsupport-linux:
    name: Test Build CsoundQt HTML5 GUI (QtWebEngine, html_support)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: update submodules
        run: |
          git submodule update --init --recursive
          git submodule status --recursive
          echo "Finished submodules"

      - name: Checkout Csound
        uses: actions/checkout@v4
        with:
          repository: csound/csound
          path: csound
          ref: develop

      - name: linux setup csound7
        run: |
          cd csound
          sudo apt-get update && sudo apt-get install cmake libsndfile1-dev libasound2-dev libjack-dev portaudio19-dev libportmidi-dev default-jdk libpng-dev libgmm++-dev bison flex libportsmf-dev libeigen3-dev libcunit1-dev
          rm -fr build-linux
          mkdir build-linux && cd build-linux
          cmake .. -DUSE_PORTMIDI=OFF -DUSE_PORTAUDIO=OFF -DUSE_PULSEAUDIO=OFF -DUSE_MP3=OFF -DBUILD_OSC_OPCODES=OFF -DBUILD_TESTS=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_UTILITIES=OFF -DBUILD_PERFTHREAD_CLASS=ON -DBUILD_CSBEATS=OFF
          cmake --build . --parallel
          sudo make install
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          sudo ldconfig
          csound --version

      - name: Install Qt with WebEngine in linux
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel'
          cache: true

      - name: linux csoundqt7 html_support build
        run: |
          qmake --version
          git submodule update --init --recursive
          qmake CONFIG+=rtmidi CONFIG+=html_support CONFIG+=release qcs.pro
          make -j$(nproc)

  buildjob-arm64-linux:
    name: Test Build CsoundQt on Linux arm64
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: update submodules
        run: |
          git submodule update --init --recursive
          git submodule status --recursive
          echo "Finished submodules"

      - name: Checkout Csound
        uses: actions/checkout@v4
        with:
          repository: csound/csound
          path: csound
          ref: develop

      - name: linux arm64 setup csound7
        run: |
          cd csound
          sudo apt-get update && sudo apt-get install cmake libsndfile1-dev libasound2-dev libjack-dev portaudio19-dev libportmidi-dev default-jdk libpng-dev libgmm++-dev bison flex libportsmf-dev libeigen3-dev libcunit1-dev
          rm -fr build-linux
          mkdir build-linux && cd build-linux
          cmake .. -DUSE_PORTMIDI=OFF -DUSE_PORTAUDIO=OFF -DUSE_PULSEAUDIO=OFF -DUSE_MP3=OFF -DBUILD_OSC_OPCODES=OFF -DBUILD_TESTS=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_UTILITIES=OFF -DBUILD_PERFTHREAD_CLASS=ON -DBUILD_CSBEATS=OFF
          cmake --build . --parallel
          sudo make install
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          sudo ldconfig
          csound --version

      - name: Install Qt 6.10 (linux arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: 'linux_arm64'
          target: 'desktop'
          arch: 'linux_gcc_arm64'
          cache: true

      - name: linux arm64 csoundqt7 build
        run: |
          qmake --version
          git submodule update --init --recursive
          qmake CONFIG+=rtmidi CONFIG+=release qcs.pro
          make -j$(nproc)
