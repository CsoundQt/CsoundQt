name: AppImage Build

on:
  push:
    branches:
      - csoundqt7
  workflow_dispatch:

jobs:
  appimage:
    name: Build AppImage
    # The bundled Qt (>= 6.9) requires glibc >= 2.34. Ubuntu 22.04 ships
    # glibc 2.35, so the resulting AppImage runs on any glibc >= 2.34 system.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build AppImage
        run: |
          ./installers/Linux/build-appimage.sh --install-deps

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: CsoundQt-AppImage
          path: build-appimage/*.AppImage
          if-no-files-found: error
