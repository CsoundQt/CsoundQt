app-id: org.csoundqt.CsoundQt
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.8'
command: CsoundQt-d-cs7
cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-run/pipewire-0
  - --share=network
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QT_NO_ACCESSIBILITY=1
  - --env=NO_AT_BRIDGE=1
  - --env=LD_LIBRARY_PATH=/app/lib:/usr/lib/x86_64-linux-gnu
  - --env=QT_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt6/plugins

modules:
  - name: libogg
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DINSTALL_DOCS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz
        sha256: 0eb4b4b9420a0f51db142ba3f9c64b333f826532dc0f48c6410ae51f4799b664
        
  - name: libvorbis
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz
        sha256: 0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab
        
  - name: libopus
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DOPUS_BUILD_PROGRAMS=OFF
      - -DOPUS_BUILD_TESTING=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/opus/opus-1.4.tar.gz
        sha256: c9b32b4253be5ae63d1ff16eea06b94b5f0f2951b7a02aceef58e3a3ce49c51f
        
  - name: libFLAC
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DWITH_OGG=ON
      - -DBUILD_DOCS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TESTING=OFF
      - -DINSTALL_MANPAGES=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/flac/flac-1.4.3.tar.xz
        sha256: 6c58e69cd22348f441b861092b825e591d0b822e106de6eb0ee4d05d27205b70
        
  - name: libsndfile
    buildsystem: simple
    build-commands:
      - cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/app
          -DCMAKE_INSTALL_LIBDIR=lib
          -DCMAKE_PREFIX_PATH=/app
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          -DBUILD_PROGRAMS=OFF
          -DBUILD_EXAMPLES=OFF
          -DBUILD_TESTING=OFF
          -DENABLE_EXTERNAL_LIBS=ON
          -DENABLE_MPEG=OFF
      - cmake --build build -j$(nproc)
      - cmake --install build

      - find /app -name 'libsndfile.a'
      - find /app -name 'libFLAC.a'
      # Merge all codec archives into libsndfile.a so Csound only needs to link one archive
      - |
        D=/app/lib
        printf 'CREATE %s/libsndfile_merged.a\nADDLIB %s/libsndfile.a\nADDLIB %s/libFLAC.a\nADDLIB %s/libvorbisenc.a\nADDLIB %s/libvorbis.a\nADDLIB %s/libogg.a\nADDLIB %s/libopus.a\nSAVE\nEND\n' \
          "$D" "$D" "$D" "$D" "$D" "$D" "$D" > /tmp/merge.mri
        ar -M < /tmp/merge.mri
        mv /app/lib/libsndfile_merged.a /app/lib/libsndfile.a
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
    sources:
      - type: archive
        url: https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
        sha256: 3799ca9924d3125038880367bf1468e53a1b7e3686a934f098b7e1d286cdb80e
        
  - name: liblo
    buildsystem: autotools
    config-opts:
      - --enable-static
      - --disable-shared
      - --disable-examples
      - --disable-tools
      - --disable-doc
    build-options:
      cflags: -fPIC -O2
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
    sources:
      - type: archive
        url: https://github.com/radarsat1/liblo/releases/download/0.35/liblo-0.35.tar.gz
        sha256: 9acc4f7e5a24f33472e9acd7e409b7bd6810a46f0a1f3cfeecea22d60f3aae13
        
  - name: csound
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_PREFIX_PATH=/app
      - -DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++
      - -DCMAKE_SHARED_LINKER_FLAGS=-static-libgcc -static-libstdc++
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_PLUGINS=ON
      - -DUSE_LIBLO=ON
      - -DUSE_ALSA=ON
      - -DUSE_JACK=ON
      - -DUSE_PORTMIDI=ON
      - -DUSE_PORTAUDIO=OFF
      - -DUSE_PULSEAUDIO=OFF
      - -DUSE_PIPEWIRE=ON
      - -DUSE_FLTK=OFF
      - -DBUILD_VIRTUAL_KEYBOARD=OFF
      - -DBUILD_JAVA_INTERFACE=OFF
      - -DBUILD_PYTHON_INTERFACE=OFF
      - -DINSTALL_PYTHON_INTERFACE=OFF
      - -DBUILD_LUA_INTERFACE=OFF
      - -DBUILD_CSBEATS=OFF
      - -DBUILD_STATIC_LIBRARY=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_INSTALLER=OFF
      - -DBUILD_UTILITIES=OFF
    sources:
      - type: git
        url: https://github.com/csound/csound
        branch: develop
        disable-shallow-clone: true

  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 org.csoundqt.CsoundQt.metainfo.xml
          /app/share/metainfo/org.csoundqt.CsoundQt.metainfo.xml
    sources:
      - type: file
        path: org.csoundqt.CsoundQt.metainfo.xml

  - name: icon
    buildsystem: simple
    build-commands:
      - install -Dm644 csoundqt.png /app/share/icons/hicolor/256x256/apps/org.csoundqt.CsoundQt.png
    sources:
      - type: file
        path: images/csoundqt.png
        # url: https://raw.githubusercontent.com/CsoundQt/CsoundQt/csoundqt7/src/images/csoundqt.png
        # dest-filename: csoundqt.png

  - name: desktop-file
    buildsystem: simple
    build-commands:
      - install -Dm644 org.csoundqt.CsoundQt.desktop
          /app/share/applications/org.csoundqt.CsoundQt.desktop
    sources:
      - type: file
        path: org.csoundqt.CsoundQt.desktop

  - name: CsoundQt
    buildsystem: simple
    build-commands:
      - which qmake
      - qmake --version  # verify this is 6.8.x before building
      - git submodule update --init --recursive
      - export QMAKEPATH=/app &&
              /usr/bin/qmake6 CONFIG+=rtmidi CONFIG+=release CONFIG+=build64 qcs.pro                           
                CSOUND_API_INCLUDE_DIR=/app/include/csound
                CSOUND_LIBRARY_DIR=/app/lib
                INSTALL_DIR=/app
                SHARE_DIR=/app/share
      - make -j$(nproc)
      - make install 
      # - mv /app/bin/bin/CsoundQt-d-cs7 /app/bin/CsoundQt-d-cs7
      # - mv /app/bin/bin/csoundqt /app/bin/csoundqt
      # - rmdir /app/bin/bin
      # - cp bin/CsoundQt-d-cs7 /app/bin/CsoundQt-d-cs7
    sources:
      - type: git
        url: https://github.com/CsoundQt/CsoundQt
        branch: csoundqt7
        disable-shallow-clone: true
